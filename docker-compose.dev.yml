# DEVELOPMENT (Local)

services:
  frontend:
    image: node:20-alpine
    container_name: nextjs_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - nextjs_node_modules:/app/node_modules  
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - app_network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=pos
      - DB_USERNAME=campos
      - DB_PASSWORD=CamPOS
    depends_on:
      - database
    networks:
      - app_network

  database:
    image: mysql:8.0
    container_name: mysql_dev
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=pos
      - MYSQL_USER=campos
      - MYSQL_PASSWORD=CamPOS
      - MYSQL_ROOT_PASSWORD=rootsecret
    volumes:
      - db_data_dev:/var/lib/mysql
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_dev
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=database
    depends_on:
      - database
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data_dev:
  nextjs_node_modules: