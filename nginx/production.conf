//nginx configuration for production environment

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name pos.camsmesystem.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pos.camsmesystem.com;

    ssl_certificate /etc/letsencrypt/live/pos.camsmesystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.camsmesystem.com/privkey.pem;

    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }

    location /api {
        set $backend_upstream laravel_app:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        set $frontend_upstream nextjs_app:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
server {
    listen 80;
    server_name dms.camsmesystem.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dms.camsmesystem.com;

    ssl_certificate /etc/letsencrypt/live/dms.camsmesystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dms.camsmesystem.com/privkey.pem;

    location / {
        set $dms_frontend nextjs_app_dms:3000;
        proxy_pass http://$dms_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    location /api {
        set $dms_backend laravel_nginx_dms:80;
        proxy_pass http://$dms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
